[project]
name = "fortress-agent-windows"
version = "0.1.0"
description = "Fortress Agent for Windows: the PC-layer lock (Spec 01, Phases 7-8)"
requires-python = ">=3.11"
# fortress-core must be installed in the same environment (pip install -e ..\core).
dependencies = [
    "cryptography>=44",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
fortress-agent = "fortress_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fortress_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
